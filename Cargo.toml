[package]
name = "breeze"
version = "0.1.0"
edition = "2021"
description = "Local-only file overlays for Git worktrees"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
dirs = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
proptest = "1"
